
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéPede - Login</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <img src="IMG/Pokemon-Logo-PNG-Background-Image.png"
             alt="Logo Pokémon" class="logo">

        <h1>Bem-vindo ao PokéPede!</h1>
        <p>Entre na sua conta para continuar.</p>

        <form>

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
            >

            <a href="#" class="forgot-password">
                Esqueceu sua senha?
            </a>

            <button type="button">Entrar</button>

        </form>

        <p class="account-text">
            Ainda não possui uma conta?
        </p>

        <a href="cadastro.html" class="auth-link">
            Criar cadastro
        </a>

        <a href="principal.html" class="back-link">
            Voltar para a loja
        </a>

    </div>

</body>
</html>
