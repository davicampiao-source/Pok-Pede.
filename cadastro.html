
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéPede - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <img src="IMG/Pokemon-Logo-PNG-Background-Image.png"
             alt="Logo Pokémon" class="logo">

        <h1>Crie sua conta!</h1>
        <p>Cadastre-se para fazer seus pedidos.</p>

        <form>

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
            >

            <label for="confirmar">Confirmar senha</label>
            <input
                type="password"
                id="confirmar"
                name="confirmar"
                placeholder="Digite a senha novamente"
            >

            <button type="button">Cadastrar</button>

        </form>

        <p class="account-text">
            Já possui uma conta?
        </p>

        <a href="index.html" class="auth-link">
            Fazer login
        </a>

        <a href="principal.html" class="back-link">
            Voltar para a loja
        </a>

    </div>

</body>
</html>
